<!DOCTYPE html>
<!--

    hello, view-source reader. the old customs are kept here.

         (o>

<html lang="{{ site.lang | default: page.lang | default: 'en' }}">
{% include head.html %}
<body class="{{ page.path | remove: '.html' }}">

	{% include header.html %}
	<main id="main" aria-label="Content">
		{{ content }}
	</main>
	{% include footer.html %}
</body>
</html>
