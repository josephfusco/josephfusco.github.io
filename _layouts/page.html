<!DOCTYPE html>
<html lang="{{ site.lang | default: page.lang | default: 'en' }}">
{% include head.html %}
<body>
	<a class="skip-link" href="#main">Skip to content</a>
	{% include header.html %}
	<main id="main" aria-label="Content">
		<div class="wrap">
			<article class="prose">
				<h1>{{ page.title }}</h1>
				{% if page.meta %}<p class="meta">{{ page.meta }}</p>{% endif %}
				{{ content }}
			</article>
		</div>
	</main>
	{% include footer.html %}
</body>
</html>
