name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # the WordPress record refreshes itself each morning
    - cron: "17 11 * * *"

permissions:
  # write, so the record can be kept between runs
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - name: Refresh the WordPress record
        run: python3 script/fetch-wp.py
        continue-on-error: true
      # the feed forgets after a day or two; the repository does not
      - name: Keep the WordPress record
        run: |
          git diff --quiet -- _data/wp.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "The WordPress record, kept" -- _data/wp.json
          git push
        continue-on-error: true
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
