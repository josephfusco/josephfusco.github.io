<header class="site-header">
	<div class="site-header-bg" aria-hidden="true"></div>
	<div class="wrap">
		<a class="site-name" href="{{ '/' | relative_url }}" aria-label="{{ site.nameplate | default: site.name }}, home">
			<svg class="site-mark" viewBox="0 0 600 600" aria-hidden="true">
				<rect x="350" y="250" />
				<rect x="50" y="350" />
				<rect x="50" y="450" />
				<rect x="150" y="450" />
				<rect x="250" y="450" />
				<rect x="250" y="350" />
				<rect x="250" y="250" />
				<rect x="250" y="150" />
				<rect x="250" y="50" />
				<rect x="350" y="50" />
				<rect x="450" y="50" />
			</svg>
		</a>
		<nav class="site-nav" aria-label="Main">
			<a href="{{ '/blog' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
			<a href="{{ '/about' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
			<a href="{{ '/design' | relative_url }}"{% if page.url contains '/design' %} aria-current="page"{% endif %}>Design</a>
		</nav>
	</div>
	<div class="powerline" aria-hidden="true">
		<svg class="wire-svg" viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M2.5 3.6 Q 55 15 100 6.5" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke" stroke-width="1"/></svg>
		<svg class="wire-pole" viewBox="0 0 34 56"><g fill="currentColor"><rect x="15" y="0" width="5" height="56"/><rect x="0" y="7" width="34" height="3" rx="1"/><rect x="4" y="4" width="2.5" height="4"/><rect x="27.5" y="4" width="2.5" height="4"/></g></svg>
	</div>
</header>
