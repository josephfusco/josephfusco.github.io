<header class="site-header">
	<div class="site-header-bg" aria-hidden="true"></div>
	<div class="wrap">
		<a class="site-name" href="{{ '/' | relative_url }}" aria-label="{{ site.nameplate | default: site.name }}, home">
			<svg class="site-mark" viewBox="0 0 600 600" aria-hidden="true">
				<rect x="350" y="250" />
				<rect x="50" y="350" />
				<rect x="50" y="450" />
				<rect x="150" y="450" />
				<rect x="250" y="450" />
				<rect x="250" y="350" />
				<rect x="250" y="250" />
				<rect x="250" y="150" />
				<rect x="250" y="50" />
				<rect x="350" y="50" />
				<rect x="450" y="50" />
			</svg>
		</a>
		<nav class="site-nav" aria-label="Main">
			<a href="{{ '/blog' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
			<a href="{{ '/about' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
			<a href="{{ '/design' | relative_url }}"{% if page.url contains '/design' %} aria-current="page"{% endif %}>Design</a>
		</nav>
	</div>
	<div class="powerline" aria-hidden="true">
		<svg class="wire-svg" viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M0 12 Q 50 12.6 100 12" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke" stroke-width="1"/></svg>
	</div>
	<div class="field-note">
		<span class="status"><span class="presence-dot" aria-hidden="true"></span> <span data-presence-count>just you here</span></span>
		<label class="region-line"><span class="tool-glyph">⊕</span> <select class="region-select" aria-label="Flock region">
			<option value="">your region</option>
			<option value="nae">North America, East</option>
			<option value="nac">North America, Central</option>
			<option value="naw">North America, West</option>
			<option value="mx">Mexico and Central America</option>
			<option value="eu">Europe</option>
			<option value="as">Asia</option>
			<option value="af">Africa</option>
			<option value="oc">Oceania</option>
			<option value="sa">South America</option>
		</select><span class="region-yours" hidden>yours</span></label>
		<button class="guide-toggle" popovertarget="field-guide"><span class="note-bird" data-species="0" data-inline aria-hidden="true"></span> field guide</button>
		<div id="field-guide" popover>
			<div class="bird-legend" data-legend aria-label="The field guide, one entry per species"></div>
		</div>
	</div>
</header>
