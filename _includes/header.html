<header class="site-header">
	<div class="site-header-bg" aria-hidden="true"></div>
	<div class="wrap">
		<a class="site-name" href="{{ '/' | relative_url }}">
			<svg class="site-mark" viewBox="0 0 600 600" aria-hidden="true">
				<rect x="350" y="250" />
				<rect x="50" y="350" />
				<rect x="50" y="450" />
				<rect x="150" y="450" />
				<rect x="250" y="450" />
				<rect x="250" y="350" />
				<rect x="250" y="250" />
				<rect x="250" y="150" />
				<rect x="250" y="50" />
				<rect x="350" y="50" />
				<rect x="450" y="50" />
			</svg>
			<span class="site-name-text"><em class="desk-of">From the desk of</em>{{ site.nameplate | default: site.name }}</span>
		</a>
		<nav class="site-nav" aria-label="Main">
			<a href="{{ '/blog' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
			<a href="{{ '/about' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
			<a href="{{ '/design' | relative_url }}"{% if page.url contains '/design' %} aria-current="page"{% endif %}>Design</a>
		</nav>
	</div>
</header>
