---
layout: default
title: Writing
redirect_from:
  - /archive/
---
<div class="wrap">
	<div class="prose">
		<h1>Writing</h1>
		<p class="meta">Notes on WordPress, front-end development, and tooling.</p>
	</div>

	<ul class="posts">
		{% for post in site.posts %}
		<li>
			<a href="{{ post.url | relative_url }}" style="view-transition-name: vt-{{ post.url | slugify }}">{{ post.title }}</a>
			<time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %Y' }}</time>
		</li>
		{% endfor %}
	</ul>

</div>
